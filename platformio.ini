[platformio]
default_envs = esp32-wroom-32d

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.3.7
  knolleary/PubSubClient @ ^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:esp32-wroom-32d]
platform = espressif32 @ ^6.12.0
board = esp32dev
extra_scripts = post:scripts/archive_firmware.py

[env:esp32-c6]
; Official PlatformIO still ships Arduino Core 2.x, which does not support C6.
; pioarduino provides the current Arduino Core 3.x toolchain for this target.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = default_8MB.csv


